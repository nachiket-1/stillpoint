<div class="indicator">005 / <span>BREATHE</span></div>

<section class="breathe">
  <canvas class="breathe__canvas" id="breatheCanvas"></canvas>

  <div class="breathe__panel">
    <p class="breathe__eyebrow">A small room to breathe</p>
    <div class="breathe__phase" id="breathePhase">ready</div>
    <div class="breathe__count" id="breatheCount">—</div>

    <div class="breathe__patterns">
      <button class="breathe__chip is-active" data-pattern="coherent">Coherent · 5·5</button>
      <button class="breathe__chip" data-pattern="box">Box · 4·4·4·4</button>
      <button class="breathe__chip" data-pattern="478">Calm · 4·7·8</button>
    </div>

    <div class="breathe__controls">
      <button class="btn btn--primary" id="breatheToggle">Begin <span class="arrow">→</span></button>
    </div>

    <p class="breathe__hint" id="breatheHint">Inhale gently through the nose · exhale through the mouth.</p>
  </div>
</section>
